customHeaders:
  # Seguridad en todo el sitio
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"

  # Página: siempre la versión más reciente
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate

  # Imágenes: una semana en caché
  - pattern: '/img/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  - pattern: '/img/*.webp'
    headers:
      - key: Content-Type
        value: image/webp
  - pattern: '/og.jpg'
    headers:
      - key: Cache-Control
        value: public, max-age=604800

  # Archivos para buscadores y motores de IA
  - pattern: '/robots.txt'
    headers:
      - key: Content-Type
        value: text/plain; charset=utf-8
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: '/llms.txt'
    headers:
      - key: Content-Type
        value: text/plain; charset=utf-8
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: '/sitemap.xml'
    headers:
      - key: Content-Type
        value: application/xml; charset=utf-8
      - key: Cache-Control
        value: public, max-age=3600
